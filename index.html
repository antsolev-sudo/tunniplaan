<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <!-- Extremely important for mobile-first: disables scaling issues -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tunniplaan (Mobile-First)</title>
    
    <!-- Clean, highly legible typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Icons for visual hierarchy -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Top App Bar - Fixed so it's always accessible -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <span class="material-icons-round icon">school</span>
                    <h1>RRK Tunniplaan</h1>
                </div>
                <!-- Dynamic class/teacher/room selector for mobile -->
                <div class="selectors-container" style="display: flex; gap: 0.5rem; align-items: center;">
                    <div class="class-selector-wrapper">
                        <select id="type-select" class="class-select" aria-label="Vali tüüp">
                            <option value="class">Klass</option>
                            <option value="teacher">Õpetaja</option>
                            <option value="room">Ruum</option>
                        </select>
                    </div>
                    <div class="class-selector-wrapper">
                        <select id="entity-select" class="class-select" aria-label="Vali">
                            <!-- Options generated by JS -->
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Day Tabs - Horizontally scrollable on mobile without showing scrollbar -->
            <div class="day-tabs-container">
                <ul class="day-tabs" id="day-tabs">
                    <li class="tab" data-day="0">E</li>
                    <li class="tab" data-day="1">T</li>
                    <li class="tab" data-day="2">K</li>
                    <li class="tab" data-day="3">N</li>
                    <li class="tab" data-day="4">R</li>
                </ul>
            </div>
        </header>

        <!-- Main Content Area: Vertical Timeline -->
        <main class="timeline-container">
            <!-- Information about the currently viewed day (e.g. "Täna on Esmaspäev, 16. märts") -->
            <div class="day-summary">
                <h2 id="current-day-title">Esmaspäev</h2>
            </div>
            
            <!-- The list of lesson cards will be injected here by JS -->
            <div class="lesson-list" id="lesson-list">
                <!-- Example Card Structure (will be dynamic) -->
                <!-- 
                <div class="lesson-card math">
                    <div class="time-column">
                        <div class="time-primary">08:45</div>
                        <div class="time-secondary">09:30</div>
                        <div class="lesson-number">1. tund</div>
                    </div>
                    <div class="info-column">
                        <h3 class="subject">Matemaatika</h3>
                        <div class="details">
                            <span class="detail-item"><span class="material-icons-round">person</span> Hanna Tulp</span>
                            <span class="detail-item"><span class="material-icons-round">room</span> 101</span>
                        </div>
                    </div>
                </div>
                -->
            </div>
        </main>
        
        <!-- Bottom padding for mobile scroll breathing room -->
        <div class="bottom-spacer"></div>
    </div>
    
    <!-- Load the scraped dynamic data -->
    <script src="timetable_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
